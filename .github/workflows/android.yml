name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          if-no-files-found: warn
          path: |
            gradle-build.log
            android/app/build/reports/

      # ----- Release avec bouton Télécharger -----
      # On supprime le tag "latest" existant pour le recréer proprement
      - name: Delete existing latest tag (if any)
        run: |
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

      - name: Create / update Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "OnE+ — Dernière version"
          body: |
            ## Télécharger l'application OnE+

            Cliquez sur **app-debug.apk** ci-dessous pour installer l'application sur Android.

            > Compilé automatiquement depuis le dernier commit sur `main`.
          prerelease: false
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
